[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metropt3-predictive-maintenance"
version = "1.0.0"
description = "Leakage-aware temporal representation study on MetroPT-3 telemetry"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
